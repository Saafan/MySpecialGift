name: mylovelygift-v2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mylovelygift
    ports:
      # 5434 avoids colliding with the V1 stack's 5433 and any system Postgres on 5432.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mylovelygift"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional S3-compatible storage for production-like runs.
  # Local development defaults to disk storage (.data/uploads) and does not need this.
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
